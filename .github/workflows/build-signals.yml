name: build-signals

# Corre el job de datos (yfinance) y PUBLICA el JSON en el repo de DATOS (branch data-signals).
# Vercel lo revalida por ISR (15 min) SIN redeploy -> los datos nunca tocan main.
# OJO: los runners de GitHub son IPs de datacenter y Yahoo puede throttlearlas.
# Mitigaciones ya en el código: curl_cffi + descarga en lote + reintentos + health gate.
# Si el bloqueo se vuelve crónico: self-hosted runner (la Mac de Facundo) o proxy residencial.

on:
  schedule:
    # Pipeline PESADO (indicadores + intradía + marcos): cada hora en horario de mercado.
    # La frescura de PRECIOS la lleva build-quotes.yml (cada 5 min, liviano).
    # Offset :07 (no en el tope de hora) -> GitHub dropea/atrasa menos las corridas.
    - cron: "7 13-21 * * 1-5"
  workflow_dispatch: {}        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

# si llega un dispatch mientras corre, se encola (no se pisan)
concurrency:
  group: build-signals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r data-pipeline/requirements.txt

      - name: Calcular señales (diario + intradía + marcos)
        run: python data-pipeline/build_signals.py

      - name: Publicar al branch `data-signals` del repo de DATOS (Vercel no lo mira -> sin deploy)
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          KEYF="$(mktemp)"; printf '%s\n' "$DATA_DEPLOY_KEY" > "$KEYF"; chmod 600 "$KEYF"
          export GIT_SSH_COMMAND="ssh -i $KEYF -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null"
          rm -rf _pub && mkdir -p _pub && cp data-pipeline/output/signals-latest.json _pub/signals-latest.json
          cd _pub
          git init -q
          git config user.name "panel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b data-signals
          git add signals-latest.json
          git commit -q -m "signals $(date -u +%F-%H%M)"
          git push -q -f "git@github.com:facundoalan81-cpu/panel-mercado-data.git" data-signals

      - name: Guardar JSON como artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-latest
          path: data-pipeline/output/signals-latest.json
          retention-days: 7
